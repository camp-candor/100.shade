<!DOCTYPE html>

    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>PIXI_CORE v1.0 - Master Console</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {

                        "error-container": "#ffdad6",

                        "inverse-primary": "#c8c6c5",
                        "surface-container-highest": "#e2e2e2",
                        "surface-container-low": "#f4f3f3",
                        "background": "#f9f9f9",
                        "on-primary-fixed-variant": "#474746",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "outline": "#747878",
                        "outline-variant": "#c4c7c7",
                        "secondary-fixed": "#ffdad5",
                        "primary": "#0a0a0a",
                        "primary-fixed-dim": "#c8c6c5",
                        "on-secondary-fixed": "#410001",

                        "on-surface-variant": "#444748",
                        "surface-tint": "#5f5e5e",
                        "on-secondary-fixed-variant": "#930005",
                        "tertiary-fixed-dim": "#ffb874",
                        "on-secondary-container": "#fffbff",
                        "surface-container-high": "#e8e8e8",
                        "tertiary-fixed": "#ffdcbf",
                        "secondary-container": "#e2241f",
                        "on-tertiary-fixed-variant": "#6a3b00"

                        "DEFAULT": "0.125rem",

                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "headline-md": ["Inter"],
                        "data-mono": ["JetBrains Mono"],
                        "body-base": ["Inter"],
                        "display-lg": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-base": ["16px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],

    <style>
        .inner-shadow-sm { box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05); }
        .inner-shadow-md { box-shadow: inset 0 4px 6px -1px rgba(0, 0, 0, 0.1), inset 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .inner-shadow-heavy { box-shadow: inset 2px 4px 8px rgba(0,0,0,0.2), inset -1px -1px 2px rgba(255,255,255,0.7); }
        .extruded { box-shadow: -1px -1px 2px rgba(255,255,255,0.8), 2px 2px 4px rgba(0,0,0,0.2); }
        .ribbing { background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px); }
        .screw { width: 8px; height: 8px; border-radius: 50%; background: #c4c7c7; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.8), inset -1px -1px 2px rgba(0,0,0,0.3); position: absolute; }
    </style>

    <div id="app"></div>
